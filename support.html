<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>どまつりダンスチーム凛サポート・補助凛 シフト表 ｜ ダンスチーム凛</title>
  <link rel="stylesheet" href="/src/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- どまつり公式風 ディープネイビー＆朱赤ヘッダーバー -->
  <header class="domatsuri-theme-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <a href="/" class="btn btn-secondary" style="width: auto; padding: 6px 14px; font-size: 0.82rem; background: rgba(255,255,255,0.1); color: #ffffff; border-color: rgba(255,255,255,0.2);">
        ← ポータルへ戻る
      </a>
      <div style="display: flex; align-items: center; gap: 10px;">
        <div class="brand-icon" style="width: 36px; height: 36px;">凛</div>
        <div>
          <div style="font-family: var(--font-family-mincho); font-size: 1.1rem; font-weight: 700; color: #ffffff; letter-spacing: 1px;">ダンスチーム凛</div>
          <div style="font-size: 0.72rem; color: #94a3b8; letter-spacing: 0.5px;">にっぽんど真ん中祭り2026 サポート・補助凛</div>
        </div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <a href="/schedule.html" class="btn" style="background: var(--domatsuri-gold); color: #0f1b29; font-weight: 700; font-size: 0.82rem; padding: 6px 14px; text-decoration: none;">
        演舞スケジュール ↗
      </a>
      <span class="badge" style="background: var(--domatsuri-red); color: #ffffff; font-weight: 700; border: none; padding: 6px 12px; font-size: 0.82rem;">
        No.132
      </span>
    </div>
  </header>

  <main class="container" style="padding-top: 24px; padding-bottom: 60px;">

    <!-- タイトルカード -->
    <div class="card header-schedule-card" style="margin-bottom: 20px; border-left: 6px solid var(--domatsuri-gold); background: linear-gradient(135deg, #ffffff 0%, #fdfbf7 100%); padding: 24px;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px;">
        <div>
          <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap;">
            <span class="badge" style="background: var(--domatsuri-navy); color: #fef08a; font-weight: 700; font-size: 0.85rem; padding: 5px 12px;">
              第28回 にっぽんど真ん中祭り 2026
            </span>
            <span class="badge" style="background: linear-gradient(135deg, #d4af37 0%, #b48a1d 100%); color: #ffffff; font-weight: 700; font-size: 0.85rem; padding: 5px 12px;">
              サポート＆補助凛シフト
            </span>
          </div>

          <h1 style="font-family: var(--font-family-mincho); font-size: clamp(1.5rem, 3.5vw, 2.1rem); font-weight: 700; color: var(--domatsuri-navy); margin: 0 0 10px 0;">
            どまつりダンスチーム凛サポート・補助凛
          </h1>
          <p style="font-size: 0.9rem; color: #475569; margin: 0; line-height: 1.6;">
            演舞を影で支えるサポート・補助凛メンバーの全3日間（8/28〜8/30）会場別シフト一覧です。<br>
            メンバー名をタップすると個人の全日程シフトを確認できます。
          </p>
        </div>

        <div class="btn-no-print" style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button onclick="window.print()" class="btn" style="background: var(--domatsuri-navy); color: #ffffff; font-size: 0.85rem; padding: 8px 16px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px;">
            🖨️ A4/シフト印刷
          </button>
        </div>
      </div>

      <!-- 凡例カード -->
      <div style="margin-top: 20px; padding: 14px; background: rgba(15, 27, 41, 0.04); border-radius: 8px; border: 1px dashed var(--border-color); display: flex; flex-wrap: wrap; gap: 16px; align-items: center;">
        <span style="font-size: 0.85rem; font-weight: 700; color: var(--domatsuri-navy);">【 記号凡例 】</span>
        <div style="display: flex; align-items: center; gap: 6px;">
          <span style="display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: #dcfce7; color: #166534; font-weight: 900; font-size: 1rem;">〇</span>
          <span style="font-size: 0.85rem; color: #1e293b; font-weight: 600;">サポート（メイン担当）</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <span style="display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: #fef9c3; color: #854d0e; font-weight: 900; font-size: 0.95rem;">△</span>
          <span style="font-size: 0.85rem; color: #1e293b; font-weight: 600;">補助凛（サブ・条件付きサポート）</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <span style="display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: #f1f5f9; color: #94a3b8; font-weight: 700; font-size: 0.9rem;">×</span>
          <span style="font-size: 0.85rem; color: #64748b;">不参加 / 対象外</span>
        </div>
      </div>
    </div>

    <!-- 検索 ＆ 絞り込みコントロール -->
    <div class="card btn-no-print" style="margin-bottom: 20px; padding: 16px;">
      <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between;">
        <div style="flex: 1; min-width: 240px; position: relative;">
          <input type="text" id="member-search" placeholder="🔍 メンバー名で検索（例: みやっち、もりた、あや子...）" style="width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.9rem; font-family: inherit;">
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
          <label style="font-size: 0.85rem; color: #475569; font-weight: 600;">表示絞り込み:</label>
          <select id="role-filter" style="padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.85rem; font-family: inherit; background: #fff;">
            <option value="all">全員表示 (16名)</option>
            <option value="support_only">〇 サポート参加者のみ</option>
            <option value="aux_only">△ 補助凛参加者を含む</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 日程選択タブ -->
    <div class="domatsuri-tabs-container btn-no-print" style="margin-bottom: 20px;">
      <button class="domatsuri-tab-btn active-day1" id="tab-btn-day1" onclick="switchSupportTab('day1')">
        1日目 8/28（金）
      </button>
      <button class="domatsuri-tab-btn" id="tab-btn-day2" onclick="switchSupportTab('day2')">
        2日目 8/29（土）
      </button>
      <button class="domatsuri-tab-btn" id="tab-btn-day3" onclick="switchSupportTab('day3')">
        3日目 8/30（日）
      </button>
      <button class="domatsuri-tab-btn" id="tab-btn-all" onclick="switchSupportTab('all')">
        全日程まとめ一覧
      </button>
    </div>

    <!-- タブコンテンツエリア -->
    <div id="support-tab-content">
      <!-- JavaScriptにより動的にレンダリングされます -->
    </div>

  </main>

  <!-- 個人シフト詳細モーダル -->
  <div id="member-modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,27,41,0.7); backdrop-filter: blur(4px); z-index: 9999; justify-content: center; align-items: center; padding: 20px;">
    <div class="card" style="max-width: 540px; width: 100%; max-height: 90vh; overflow-y: auto; background: #ffffff; border-radius: 12px; border: 2px solid var(--domatsuri-gold); padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); position: relative;">
      <button onclick="closeMemberModal()" style="position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #64748b;">✕</button>
      <div id="modal-content">
        <!-- JSで挿入 -->
      </div>
    </div>
  </div>

  <script type="module" src="/src/support.js"></script>
</body>
</html>
