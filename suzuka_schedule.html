<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>すずかフェスティバル2026 公式演舞スケジュール ｜ ダンスチーム凛</title>
  <link rel="stylesheet" href="/src/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
  <!-- html2pdf for PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    .filter-container {
      background: #0f1b29;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #d4af37;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .filter-label {
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    .filter-checkbox {
      width: 18px;
      height: 18px;
      accent-color: #d4af37;
    }
    .team-badge-rin { background: #d93829; color: #fff; }
    .team-badge-jr { background: #2563eb; color: #fff; }
    .team-badge-kids { background: #16a34a; color: #fff; }
    
    .timeline-table th { background: #0f1b29; color: #d4af37; font-weight: 700; padding: 12px; border-bottom: 2px solid #d4af37; }
    .timeline-table td { padding: 14px 10px; border-bottom: 1px solid #334155; vertical-align: middle; }
    .timeline-table tr:hover { background: #1e293b; }
  </style>
</head>
<body style="background-color: var(--bg-dark); color: var(--text-main); font-family: 'Inter', sans-serif;">
  <header class="saas-topbar" style="justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div class="brand-icon" style="width: 32px; height: 32px; font-size: 1rem;">凛</div>
      <div class="brand-title" style="font-size: 1rem;">ダンスチーム凛</div>
    </div>
    <div>
      <a href="/index.html" class="btn btn-secondary" style="font-size: 0.75rem; padding: 6px 12px; text-decoration: none;">← ポータルへ戻る</a>
    </div>
  </header>

  <main class="container" style="max-width: 900px; padding-top: 24px; padding-bottom: 60px;">
    
    <!-- ヘッダーエリア -->
    <div style="text-align: center; margin-bottom: 30px;">
      <h1 style="font-family: var(--font-family-mincho); font-size: 1.8rem; font-weight: 700; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); margin-bottom: 8px;">
        第28回 すずかフェスティバル 2026
      </h1>
      <div style="font-size: 0.85rem; color: #fef08a; letter-spacing: 1px; font-weight: 700;">
        チーム別 演舞スケジュール ＆ タイムライン
      </div>
    </div>

    <!-- チーム絞り込みUI -->
    <div class="filter-container">
      <div style="width: 100%; text-align: center; font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px;">表示するチームを選択（複数可）</div>
      <label class="filter-label">
        <input type="checkbox" class="filter-checkbox" value="rin" checked> ダンスチーム凛
      </label>
      <label class="filter-label">
        <input type="checkbox" class="filter-checkbox" value="jr" checked> 凛ジュニア
      </label>
      <label class="filter-label">
        <input type="checkbox" class="filter-checkbox" value="kids" checked> 凛きっず
      </label>
    </div>

    <!-- 9/5 (土) スケジュール -->
    <div class="card" style="margin-bottom: 32px; padding: 0; overflow: hidden; border-color: #d4af37;">
      <div style="background: linear-gradient(90deg, #0f1b29 0%, #1e293b 100%); padding: 16px 20px; border-bottom: 2px solid #d4af37;">
        <h2 style="font-size: 1.3rem; color: #ffffff; margin: 0; font-family: var(--font-family-mincho);">
          9月5日 (土) <span style="font-size: 0.9rem; color: #cbd5e1; font-family: 'Inter', sans-serif;">第1日目</span>
        </h2>
      </div>
      <div style="overflow-x: auto;">
        <table class="timeline-table" style="width: 100%; min-width: 600px; border-collapse: collapse;">
          <thead>
            <tr>
              <th style="width: 80px; text-align: center;">時間</th>
              <th style="width: 110px; text-align: center;">チーム</th>
              <th>会場</th>
              <th style="width: 80px; text-align: center;">種別</th>
            </tr>
          </thead>
          <tbody id="schedule-body-day1">
            <!-- JSで動的生成 -->
          </tbody>
        </table>
        <div id="empty-msg-day1" style="display:none; text-align:center; padding: 24px; color: #94a3b8;">表示対象のスケジュールがありません。</div>
      </div>
    </div>

    <!-- 9/6 (日) スケジュール -->
    <div class="card" style="margin-bottom: 32px; padding: 0; overflow: hidden; border-color: #d4af37;">
      <div style="background: linear-gradient(90deg, #0f1b29 0%, #1e293b 100%); padding: 16px 20px; border-bottom: 2px solid #d4af37;">
        <h2 style="font-size: 1.3rem; color: #ffffff; margin: 0; font-family: var(--font-family-mincho);">
          9月6日 (日) <span style="font-size: 0.9rem; color: #cbd5e1; font-family: 'Inter', sans-serif;">第2日目</span>
        </h2>
      </div>
      <div style="overflow-x: auto;">
        <table class="timeline-table" style="width: 100%; min-width: 600px; border-collapse: collapse;">
          <thead>
            <tr>
              <th style="width: 80px; text-align: center;">時間</th>
              <th style="width: 110px; text-align: center;">チーム</th>
              <th>会場</th>
              <th style="width: 80px; text-align: center;">種別</th>
            </tr>
          </thead>
          <tbody id="schedule-body-day2">
            <!-- JSで動的生成 -->
          </tbody>
        </table>
        <div id="empty-msg-day2" style="display:none; text-align:center; padding: 24px; color: #94a3b8;">表示対象のスケジュールがありません。</div>
      </div>
    </div>

  </main>

  <script>
    // スケジュールデータ
    const scheduleData = [
      // 9/5 (Sat)
      { id: "rin", name: "ダンスチーム凛", date: "day1", time: "10:20", venue: "弁天山", type: "演舞" },
      { id: "rin", name: "ダンスチーム凛", date: "day1", time: "12:45", venue: "弁天山審査", type: "審査" },
      { id: "rin", name: "ダンスチーム凛", date: "day1", time: "15:30", venue: "ハンター", type: "演舞" },
      
      { id: "jr", name: "凛ジュニア", date: "day1", time: "12:10", venue: "弁天山", type: "演舞" },
      { id: "jr", name: "凛ジュニア", date: "day1", time: "14:55", venue: "弁天山審査", type: "審査" },
      { id: "jr", name: "凛ジュニア", date: "day1", time: "17:20", venue: "ハンター", type: "演舞" },
      
      { id: "kids", name: "凛きっず", date: "day1", time: "11:35", venue: "ハンター", type: "演舞" },
      { id: "kids", name: "凛きっず", date: "day1", time: "14:40", venue: "JA鈴鹿", type: "演舞" },
      { id: "kids", name: "凛きっず", date: "day1", time: "18:10", venue: "弁天山審査", type: "審査" },
      
      // 9/6 (Sun)
      { id: "rin", name: "ダンスチーム凛", date: "day2", time: "12:05", venue: "ハンター", type: "演舞" },
      { id: "rin", name: "ダンスチーム凛", date: "day2", time: "15:05", venue: "JA鈴鹿", type: "演舞" },
      { id: "rin", name: "ダンスチーム凛", date: "day2", time: "17:35", venue: "弁天山審査", type: "審査" },
      
      { id: "jr", name: "凛ジュニア", date: "day2", time: "10:00", venue: "ハンター", type: "演舞" },
      { id: "jr", name: "凛ジュニア", date: "day2", time: "13:00", venue: "JA鈴鹿", type: "演舞" },
      { id: "jr", name: "凛ジュニア", date: "day2", time: "15:05", venue: "弁天山審査", type: "審査" },
      
      { id: "kids", name: "凛きっず", date: "day2", time: "10:00", venue: "弁天山", type: "演舞" },
      { id: "kids", name: "凛きっず", date: "day2", time: "12:25", venue: "弁天山審査", type: "審査" },
      { id: "kids", name: "凛きっず", date: "day2", time: "14:50", venue: "ハンター", type: "演舞" },
    ];

    function getBadgeClass(id) {
      if(id === 'rin') return 'team-badge-rin';
      if(id === 'jr') return 'team-badge-jr';
      if(id === 'kids') return 'team-badge-kids';
      return '';
    }

    function renderSchedule() {
      // 選択されているチームIDを取得
      const checkboxes = document.querySelectorAll('.filter-checkbox');
      const selectedIds = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);

      // 時間順にソートする関数
      const sortFn = (a, b) => a.time.localeCompare(b.time);

      ['day1', 'day2'].forEach(day => {
        const tbody = document.getElementById('schedule-body-' + day);
        const emptyMsg = document.getElementById('empty-msg-' + day);
        tbody.innerHTML = '';
        
        // フィルタリング ＆ ソート
        const items = scheduleData
          .filter(d => d.date === day && selectedIds.includes(d.id))
          .sort(sortFn);

        if (items.length === 0) {
          emptyMsg.style.display = 'block';
        } else {
          emptyMsg.style.display = 'none';
          items.forEach(item => {
            const tr = document.createElement('tr');
            
            // 審査の場合は行をハイライト
            if(item.type === '審査') {
              tr.style.background = 'rgba(217, 56, 41, 0.1)';
            }

            tr.innerHTML = `
              <td style="text-align: center; font-weight: 700; font-size: 1.1rem; color: var(--gold-primary);">
                ${item.time}
              </td>
              <td style="text-align: center;">
                <span class="badge ${getBadgeClass(item.id)}" style="font-size:0.75rem; border:none; padding: 4px 8px;">
                  ${item.name}
                </span>
              </td>
              <td style="font-weight: 700; font-size: 1.05rem;">
                ${item.venue}
              </td>
              <td style="text-align: center;">
                <span class="badge" style="background:${item.type === '審査' ? '#991b1b' : '#334155'}; color:#fff; border:none;">
                  ${item.type}
                </span>
              </td>
            `;
            tbody.appendChild(tr);
          });
        }
      });
    }

    // イベントリスナー設定
    document.querySelectorAll('.filter-checkbox').forEach(cb => {
      cb.addEventListener('change', renderSchedule);
    });

    // 初期描画
    renderSchedule();
  </script>
</body>
</html>
