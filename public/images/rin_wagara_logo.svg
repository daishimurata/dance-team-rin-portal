<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 金色グラデーション -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#c59b27"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g fill="url(#goldGrad)">
    <!-- 流水波模様 (上部) -->
    <path d="M 180 50 C 240 20, 280 80, 220 100 C 170 115, 230 150, 260 140 C 290 130, 240 180, 160 180 C 100 180, 80 200, 40 210 C 10 215, 70 230, 120 220 C 170 210, 260 190, 220 230" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 210 70 C 250 50, 270 90, 230 110 C 190 130, 250 160, 220 180" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.8"/>

    <!-- 菊の紋章 (左下・大輪) -->
    <g transform="translate(140, 390)">
      <!-- 菊の花びら32枚 -->
      <circle cx="0" cy="0" r="18" fill="url(#goldGrad)"/>
      <g stroke="url(#goldGrad)" stroke-width="2">
        <path d="M 0 -22 L 0 -75 M 0 22 L 0 75 M -22 0 L -75 0 M 22 0 L 75 0"/>
        <path d="M -15 -15 L -53 -53 M 15 15 L 53 53 M -15 15 L -53 53 M 15 -15 L 53 -53"/>
        <path d="M -8 -20 L -28 -70 M 8 20 L 28 70 M -20 8 L -70 28 M 20 -8 L 70 -28"/>
        <path d="M 8 -20 L 28 -70 M -8 20 L -28 70 M 20 8 L 70 28 M -20 -8 L -70 -28"/>
        <path d="M -20 -8 L -70 -28 M 20 8 L 70 28 M -8 -20 L -28 -70 M 8 20 L 28 70"/>
        <path d="M -20 8 L -70 28 M 20 -8 L 70 -28 M 8 -20 L 28 -70 M -8 20 L -28 70"/>
      </g>
      <circle cx="0" cy="0" r="75" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4"/>
    </g>

    <!-- 菊の紋章 (右上・中輪 2基) -->
    <g transform="translate(340, 110) scale(0.45)">
      <circle cx="0" cy="0" r="15" fill="url(#goldGrad)"/>
      <g stroke="url(#goldGrad)" stroke-width="3">
        <path d="M 0 -20 L 0 -65 M 0 20 L 0 65 M -20 0 L -65 0 M 20 0 L 65 0"/>
        <path d="M -14 -14 L -46 -46 M 14 14 L 46 46 M -14 14 L -46 46 M 14 -14 L 46 -46"/>
      </g>
    </g>
    <g transform="translate(420, 145) scale(0.4)">
      <circle cx="0" cy="0" r="15" fill="url(#goldGrad)"/>
      <g stroke="url(#goldGrad)" stroke-width="3">
        <path d="M 0 -20 L 0 -65 M 0 20 L 0 65 M -20 0 L -65 0 M 20 0 L 65 0"/>
        <path d="M -14 -14 L -46 -46 M 14 14 L 46 46 M -14 14 L -46 46 M 14 -14 L 46 -46"/>
      </g>
    </g>

    <!-- 蓮の花 (右下) -->
    <g transform="translate(420, 410) scale(0.6)">
      <path d="M 0 20 Q -30 -20 0 -60 Q 30 -20 0 20" />
      <path d="M -15 20 Q -50 -10 -35 -45 Q -10 -25 -15 20" />
      <path d="M 15 20 Q 50 -10 35 -45 Q 10 -25 15 20" />
      <path d="M -30 25 Q -70 5 -55 -25 Q -25 0 -30 25" />
      <path d="M 30 25 Q 70 5 55 -25 Q 25 0 30 25" />
    </g>

    <!-- 「凛」筆文字 (中央〜右手) -->
    <text x="330" y="320" font-family="'Shippori Mincho', 'Noto Serif JP', serif" font-size="210" font-weight="900" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">
      凛
    </text>
  </g>
</svg>
